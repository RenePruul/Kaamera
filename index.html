<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Trap Trull</title>
    <style>
      .controls {
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .row {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      button {
        padding: 6px 12px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      /* Camera Feed Container */
      .stage {
        position: relative;
        width: 360px;
        height: 270px;
        background: #ddd;
      }

      video,
      svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Visual Markers & Overlays */
      .mark,
      .overlay {
        position: absolute;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 2;
      }

      .mark {
        width: 16px;
        height: 16px;
        background: #000;
        color: #fff;
        border-radius: 50%;
        text-align: center;
        font-size: 10px;
        line-height: 16px;
      }

      .overlay {
        width: 18px;
        height: 18px;
        border: 2px solid #fff;
      }

      .line {
        stroke: rgba(255, 255, 255, 0.9);
        stroke-width: 2;
      }

      /* Digital Game Board */
      .board {
        display: grid;
        grid-template-columns: repeat(3, 70px);
        grid-template-rows: repeat(3, 70px);
        gap: 4px;
        background: #999;
      }

      .cell {
        position: relative;
        background: #fff;
        display: grid;
        place-items: center;
        font-weight: bold;
      }

      .num {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 9px;
        color: #aaa;
      }

      .piece {
        width: 36px;
        height: 36px;
      }
    </style>
  </head>

  <body>
    <h2>Trip Trap Trull</h2>

    <!-- Control Panel -->
    <div class="controls">
      <label
        ><input
          type="radio"
          name="color-choice"
          value="red"
          checked
        />Red</label
      >
      <label
        ><input type="radio" name="color-choice" value="green" /> Green</label
      >
      <button id="btn-camera">Start Camera</button>
      <button id="btn-calibrate" disabled>Calibrate Grid</button>
      <button id="btn-start" disabled>Start Game</button>
    </div>

    <div id="status">Start camera first.</div>
    <br />

    <!-- Interactive Stage Layout -->
    <div class="row">
      <div class="stage" id="stage">
        <video id="video" autoplay muted playsinline></video>
        <svg id="svg"></svg>
        <div id="marks"></div>
      </div>
      <div class="board" id="board"></div>
    </div>

    <!-- Offscreen Processing Canvas -->
    <canvas id="canvas" hidden></canvas>

    <script>
      // Configuration & Game Rules
      const API_ENDPOINT =
        "https://script.google.com/a/macros/tlu.ee/s/AKfycbxsZ6AQF0pqkSnEzIAAVfmYHRuDQ3OZidgrYg2hIykBpGLFQ2CODzzL7mosuzzm-7Cofw/exec";
      const COLOR_PALETTE = { red: "#c23c35", green: "#18794e" };
      const WINNING_COMBINATIONS = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8], // Rows
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8], // Columns
        [0, 4, 8],
        [2, 4, 6], // Diagonals
      ];

      // DOM Elements
      const video = document.getElementById("video");
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const boardElement = document.getElementById("board");
      const statusElement = document.getElementById("status");
      const svgElement = document.getElementById("svg");
      const marksElement = document.getElementById("marks");
      const btnCamera = document.getElementById("btn-camera");
      const btnCalibrate = document.getElementById("btn-calibrate");
      const btnStart = document.getElementById("btn-start");

      // Runtime State Variables
      let board = Array(9).fill(null);
      let corners = [];
      let isGameActive = false;
      let isWaitingForHuman = false;
      let humanColor = "red";
      let botColor = "green";
      let turnCount = 0;
      let gameId = 0;

      /**
       * Updates status message banner in UI.
       * @param {string} message - Text to render in status bar.
       */
      function setStatus(message) {
        statusElement.textContent = message;
      }

      /**
       * Bilinear Interpolation Algorithm:
       * Maps normalized grid positions (u, v) ∈ [0.0, 1.0] to arbitrary quadrilateral points on video stream.
       * Corner Sequence: [0] Top-Left, [1] Top-Right, [2] Bottom-Right, [3] Bottom-Left.
       *
       * @param {number} u - Horizontal ratio across quadrilateral (0.0 = left edge, 1.0 = right edge).
       * @param {number} v - Vertical ratio across quadrilateral (0.0 = top edge, 1.0 = bottom edge).
       * @returns {{x: number, y: number}} Interpolated point coordinates.
       */
      function mapPoint(u, v) {
        const topX = corners[0].x * (1 - u) + corners[1].x * u;
        const topY = corners[0].y * (1 - u) + corners[1].y * u;
        const bottomX = corners[3].x * (1 - u) + corners[2].x * u;
        const bottomY = corners[3].y * (1 - u) + corners[2].y * u;

        return {
          x: topX * (1 - v) + bottomX * v,
          y: topY * (1 - v) + bottomY * v,
        };
      }

      /**
       * UI Render Engine:
       * 1. Rebuilds digital grid state display.
       * 2. Renders 4 corner selection pins over video feed.
       * 3. Projects perspective 3x3 SVG lines and tile overlays using bilinear mapping.
       */
      function render() {
        // 1. Digital board state
        boardElement.innerHTML = board
          .map(
            (cell, index) => `
        <div class="cell">
          <span class="num">${index + 1}</span>
          ${cell ? `<div class="piece" style="background:${COLOR_PALETTE[cell.color]}; border-radius:${cell.player === "human" ? "50%" : "0"}"></div>` : ""}
        </div>
      `,
          )
          .join("");

        // 2. Camera overlay corner pins
        let marksHTML = corners
          .map(
            (point, index) =>
              `<div class="mark" style="left:${point.x * 100}%; top:${point.y * 100}%">${index + 1}</div>`,
          )
          .join("");
        let svgHTML = "";

        // 3. Perspective Grid Lines & Board Tile Overlays
        if (corners.length === 4) {
          // Draw perspective grid subdivisions
          for (let i = 1; i < 3; i++) {
            const v1 = mapPoint(i / 3, 0);
            const v2 = mapPoint(i / 3, 1);
            const h1 = mapPoint(0, i / 3);
            const h2 = mapPoint(1, i / 3);

            svgHTML += `<line x1="${v1.x * 100}%" y1="${v1.y * 100}%" x2="${v2.x * 100}%" y2="${v2.y * 100}%" class="line"/>`;
            svgHTML += `<line x1="${h1.x * 100}%" y1="${h1.y * 100}%" x2="${h2.x * 100}%" y2="${h2.y * 100}%" class="line"/>`;
          }

          // Draw projected moves onto live video stream
          board.forEach((cell, index) => {
            if (!cell) return;
            const point = mapPoint(
              ((index % 3) + 0.5) / 3,
              (Math.floor(index / 3) + 0.5) / 3,
            );
            marksHTML += `<div class="overlay" style="left:${point.x * 100}%; top:${point.y * 100}%; background:${COLOR_PALETTE[cell.color]}; border-radius:${cell.player === "human" ? "50%" : "0"}"></div>`;
          });
        }

        marksElement.innerHTML = marksHTML;
        svgElement.innerHTML = svgHTML;
      }

      /**
       * Computer Vision Processing Engine:
       * 1. Captures active frame onto offscreen canvas buffer.
       * 2. Iterates over open squares on board.
       * 3. Samples 5x5 pixel cluster centered within square region (inner 40% area).
       * 4. Converts interpolated relative coordinates to 1D canvas image data buffer index.
       * 5. Color Discriminator Thresholding:
       *    - RED: r > 100 AND r > g * 1.3 AND r > b * 1.3
       *    - GREEN: g > 80 AND g > r * 1.2
       * 6. Triggers player move if ≥6 samples match expected player color.
       */
      function scanCameraFeed() {
        if (!isGameActive || !isWaitingForHuman || corners.length !== 4) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 9; i++) {
          if (board[i]) continue;

          let redMatchCount = 0;
          let greenMatchCount = 0;
          const row = Math.floor(i / 3);
          const col = i % 3;

          // Sample 5x5 grid in center of cell
          for (let y = 0; y < 5; y++) {
            for (let x = 0; x < 5; x++) {
              const point = mapPoint(
                (col + 0.3 + x * 0.1) / 3,
                (row + 0.3 + y * 0.1) / 3,
              );

              // Linear Index in 1D RGBA ImageData array: (y * width + x) * 4
              const pixelX = Math.round(point.x * canvas.width);
              const pixelY = Math.round(point.y * canvas.height);
              const offset = (pixelY * canvas.width + pixelX) * 4;

              const r = frameData.data[offset];
              const g = frameData.data[offset + 1];
              const b = frameData.data[offset + 2];

              if (r > 100 && r > g * 1.3 && r > b * 1.3) redMatchCount++;
              if (g > 80 && g > r * 1.2) greenMatchCount++;
            }
          }

          const detectedColor =
            redMatchCount > 5 ? "red" : greenMatchCount > 5 ? "green" : null;
          if (detectedColor === humanColor) {
            executeMove(i, "human", detectedColor);
            break;
          }
        }
      }
      /**
       * Executes turn logic, checks win conditions, logs move data, and triggers bot response.
       * @param {number} index - Targeted board cell index [0..8].
       * @param {string} player - Player key ('human' or 'computer').
       * @param {string} color - Selected color key ('red' or 'green').
       */
      function executeMove(index, player, color) {
        board[index] = { player, color };
        turnCount++;
        isWaitingForHuman = player === "computer";
        render();

        // Non-blocking asynchronous API call
        fetch(API_ENDPOINT, {
          method: "POST",
          mode: "no-cors", // Required for Google Apps Script endpoint on GitHub Pages
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            gameId,
            player,
            color,
            cell: index + 1,
            turnNr: turnCount,
          }),
        }).catch((err) => console.error("Logging error:", err));

        // Check game over condition or trigger bot move
        if (checkWin(player)) {
          isGameActive = false;
          setStatus(`${player === "human" ? "You win!" : "Bot wins!"}`);
          return;
        }

        if (board.every((cell) => cell !== null)) {
          isGameActive = false;
          setStatus("It's a draw!");
          return;
        }

        // Trigger bot move after a short delay if it's the computer's turn
        if (player === "human" && isGameActive) {
          setStatus("Bot is thinking...");
          setTimeout(executeBotMove, 800);
        } else if (player === "computer" && isGameActive) {
          setStatus("Your turn!");
        }
      }

      /**
       * Chooses an open square randomly for computer turn.
       */
      function executeBotMove() {
        if (!isGameActive) return;
        const openCells = board
          .map((cell, index) => (cell ? -1 : index))
          .filter((index) => index >= 0);
        if (openCells.length) {
          const choice =
            openCells[Math.floor(Math.random() * openCells.length)];
          executeMove(choice, "computer", botColor);
        }
      }

      // Event Listeners
      btnCamera.onclick = async () => {
        try {
          video.srcObject = await navigator.mediaDevices.getUserMedia({
            video: true,
          });
          btnCalibrate.disabled = false;
          setStatus('Click "Calibrate Grid".');
        } catch (error) {
          setStatus("Camera error: " + error.message);
        }
      };

      btnCalibrate.onclick = () => {
        corners = [];
        render();
        setStatus("Click 4 grid corners in order: TL, TR, BR, BL.");
      };

      stage.onclick = (event) => {
        if (corners.length >= 4) return;

        const bounds = stage.getBoundingClientRect();
        corners.push({
          x: (event.clientX - bounds.left) / bounds.width,
          y: (event.clientY - bounds.top) / bounds.height,
        });
        render();

        if (corners.length === 4) {
          btnStart.disabled = false;
          setStatus('Grid calibrated. Click "Start Game".');
        }
      };

      btnStart.onclick = () => {
        board.fill(null);
        humanColor = document.querySelector(
          'input[name="color-choice"]:checked',
        ).value;
        botColor = humanColor === "red" ? "green" : "red";
        turnCount = 0;
        gameId += 1;
        isGameActive = true;
        isWaitingForHuman = true;

        render();
        setStatus(`Game ${gameId} started! Your turn.`);
        setInterval(scanCameraFeed, 400);
      };

      // Initial View Initialization
      render();
    </script>
  </body>
</html>
